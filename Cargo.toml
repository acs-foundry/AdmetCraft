[workspace]
resolver = "3"
members = [
    "crates/chem-core",
    "crates/admet-calc",
    "crates/admet-qsar",
    "crates/admet-report",
    "crates/admet-engine",
    "apps/admetcraft-cli",
    "apps/admetcraft",
    "xtask",
]

[workspace.package]
version = "1.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
eframe = "0.31"
egui = "0.31"
craftbio-scene = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.2.2" }
craftbio-report = { git = "https://github.com/acs-foundry/craftbio-libs", tag = "v1.2.2" }

[profile.release]
overflow-checks = true
